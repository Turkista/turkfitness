<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecionando… — Turk Fitness</title>
<!-- Este artigo agora tem uma página própria em /blog/<slug>.html. Esta
     URL antiga (?slug=...) é mantida só para não quebrar links que já
     foram compartilhados — todo mundo que chegar aqui é redirecionado. -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.turkfitness.com.br/blog.html">
<script>
(function(){
  var slug = new URLSearchParams(location.search).get('slug');
  var destino = slug ? '/blog/' + encodeURIComponent(slug) + '.html' : '/blog.html';
  location.replace(destino);
})();
</script>
</head>
<body>
<p>Redirecionando para o artigo… Se não for redirecionado automaticamente, <a id="link-manual" href="/blog.html">clique aqui</a>.</p>
<script>
  (function(){
    var slug = new URLSearchParams(location.search).get('slug');
    if(slug){ document.getElementById('link-manual').setAttribute('href', '/blog/' + encodeURIComponent(slug) + '.html'); }
  })();
</script>
</body>
</html>
