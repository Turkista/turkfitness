name: SEO validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'produto/**'
      - 'blog/**'
      - 'produto/_template.html'
      - 'blog/_template.html'
      - 'catalogo.html'
      - 'src/content/produtos/**'
      - 'src/content/blog/**'
      - 'scripts/gerar-sitemap.js'
      - 'painel-turkfitness/**'
      - '.github/workflows/seo-tests.yml'
  push:
    branches:
      - main
      - 'seo/**'

jobs:
  seo-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: painel-turkfitness/package-lock.json
      - name: Install dependencies
        working-directory: painel-turkfitness
        run: npm ci
      - name: Run SEO and sitemap tests
        working-directory: painel-turkfitness
        run: |
          npm test
          npm run sitemap:check
