name: Optimize static WebP assets

on:
  push:
    branches:
      - main
    paths:
      - 'painel-turkfitness/otimizar-imagens-existentes.js'

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: painel-turkfitness/package-lock.json
      - name: Install image optimizer
        working-directory: painel-turkfitness
        run: npm ci
      - name: Optimize WebP images
        working-directory: painel-turkfitness
        run: npm run images:optimize -- --write
      - name: Commit optimized assets
        run: |
          if git diff --quiet -- assets/; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Otimiza imagens WebP para carregamento mais rápido"
          git push origin main
